<!DOCTYPE html>
<html>
<head>
    <title>E2E Automation Metrics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <h2>Appium Test Metrics & Execution Dashboard</h2>
    <div class="grid">
        <div class="card">
            <h3>Overall Status Breakdown</h3>
            <canvas id="statusChart"></canvas>
        </div>
        <div class="card">
            <h3>Execution Summary Info</h3>
            <p><strong>Total Executed:</strong> 471</p>
            <p><strong>Passed:</strong> 471</p>
            <p><strong>Failed:</strong> 0</p>
            <p><strong>Pass Rate:</strong> 100.0%</p>
            <p><strong>Total Duration:</strong> 0s</p>
        </div>
    </div>
    <script>
        const ctx = document.getElementById('statusChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Passed', 'Failed', 'Skipped'],
                datasets: [{
                    data: [471, 0, 0],
                    backgroundColor: ['#10b981', '#ef4444', '#f59e0b']
                }]
            }
        });
    </script>
</body>
</html>
